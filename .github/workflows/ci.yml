name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664

      - name: Run tests
        run: make test

  performance:
    name: Performance (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true  # Shared runners are not stable timing environments.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664

      - name: Install pinned Vegeta
        run: |
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/vegeta.tar.gz" \
            'https://github.com/tsenart/vegeta/releases/download/v12.13.0/vegeta_12.13.0_linux_amd64.tar.gz'
          echo 'e8759ce45c14e18374bdccd3ba6068197bc3a9f9b7e484db3837f701b9d12e61  '"$RUNNER_TEMP/vegeta.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vegeta.tar.gz" -C "$RUNNER_TEMP" vegeta
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Evaluate HTTP performance (informational)
        env:
          PERF_DURATION: 10s
        run: make perf-check

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-performance-${{ github.run_id }}
          path: perf/results/
          if-no-files-found: warn
          retention-days: 14
